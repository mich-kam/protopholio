# Blueprint Render : base PostgreSQL + service web Django.
# Déploiement : Render > New > Blueprint > sélectionner le dépôt.
databases:
  - name: portfolio-db
    plan: free
    databaseName: portfolio
    user: portfolio

services:
  - type: web
    name: ir-kamango-mich
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString
      - key: WEB_CONCURRENCY
        value: "2"
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
      - key: LOAD_DEMO_DATA
        value: "1"
      - key: CURRENCY_CODE
        value: "USD"
      - key: CURRENCY_SYMBOL
        value: "$"
      # Messages du formulaire de contact → ta boîte Gmail
      - key: CONTACT_RECIPIENT
        value: "michk2216@gmail.com"
      - key: DEFAULT_FROM_EMAIL
        value: "michk2216@gmail.com"
      # SMTP Gmail (mot de passe d'application, pas le mot de passe du compte) :
      - key: EMAIL_HOST
        value: "smtp.gmail.com"
      - key: EMAIL_PORT
        value: "587"
      - key: EMAIL_USE_TLS
        value: "true"
      - key: EMAIL_HOST_USER
        value: "michk2216@gmail.com"
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Ajoutez vos clés Flutterwave dans le dashboard Render pour activer les vrais paiements :
      - key: FLUTTERWAVE_PUBLIC_KEY
        sync: false
      - key: FLUTTERWAVE_SECRET_KEY
        sync: false
