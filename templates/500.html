<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Erreur serveur / Server error</title>
  <style>
    body { font-family: "DM Sans", system-ui, sans-serif; background: #0f172a; color: #e2e8f0; display: grid; place-items: center; min-height: 100vh; margin: 0; text-align: center; padding: 1.5rem; }
    h1 { font-size: 4rem; margin: 0; color: #14b8a6; letter-spacing: -0.04em; }
    p { max-width: 28rem; margin: 1rem auto 0; line-height: 1.6; color: #94a3b8; }
    a { color: #5eead4; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  {# Page autonome : pas de dépendance au contexte Django ni à la base. #}
  <div>
    <h1>500</h1>

       Something went wrong on our side. Please try again shortly.</p>
    <p><a href="/">Retour à l'accueil · Back home</a></p>
  </div>

</html>
